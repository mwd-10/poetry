<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المولد البصري للقصائد</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>المولد البصري للقصائد</h1>
            <p>حوّل أبياتك الشعرية إلى بطاقات بصرية راقية بنقرة واحدة</p>
        </header>

        <main class="workspace">
            <!-- قسم إدخال البيانات -->
            <section class="input-card">
                <div class="form-group">
                    <label for="poemInput">البيت الشعري:</label>
                    <textarea id="poemInput" placeholder="أَعَزيزُ قَومٍ ذَلَّ في سُلطانِهِ..." rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="authorInput">اسم الشاعر (اختياري):</label>
                    <input type="text" id="authorInput" placeholder="مثال: أبو تمام">
                </div>

                <!-- اختيار نمط البطاقة -->
                <div class="form-group">
                    <label for="themeSelect">اختر نمط ولون البطاقة:</label>
                    <select id="themeSelect">
                        <option value="brown">بني كلاسيكي</option>
                        <option value="gray">رمادي غائم</option>
                        <option value="blue">أزرق كحلي</option>
                        <option value="olive">أخضر زيتوني</option>
                    </select>
                </div>

                <button id="generateBtn" class="primary-btn">تصميم البطاقة ✨</button>
            </section>

            <!-- قسم المعاينة والتحليل -->
            <section class="preview-card">
                <div class="card-display">
                    <p id="displayText" class="poetry-text">أدخل بيت شعر لمعاينته هنا...</p>
                    <p id="displayAuthor" class="author-text"></p>
                </div>

                <div class="analysis-box">
                    <span>القافية المستخرجة: <strong id="rhymeBadge">-</strong></span>
                </div>

                <button id="downloadBtn" class="secondary-btn" disabled>
                    تحميل البطاقة 🎴
                </button>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
